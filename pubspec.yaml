name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  country_picker: ^2.0.28
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_map: ^8.3.2
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.0.10
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  phone_numbers_parser: ^9.0.28
  provider: ^6.1.5+1
  record: ^6.2.1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4 # 👈 اتغيرت النسخة
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# 👈 على مستوى الـ root (من أول السطر، بره flutter:)
flutter_launcher_icons:
  android: true
  ios: true
  # 👈 المربع الكامل 1024 (من غير زوايا مدوّرة) عشان iOS بيدوّرها بنفسه
  image_path: "assets/images/closercrm_icon_square.png"
  remove_alpha_ios: true

  # Android adaptive icon
  adaptive_icon_background: "#000000" # أسود، نفس AppColors.navy الجديد
  adaptive_icon_foreground: "assets/images/closercrm_icon_foreground.png" # 👈 الـ C والنقطة بس
